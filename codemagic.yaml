# Codemagic CI/CD for Darul Irfan iOS
#
# Two workflows:
#   ios-verify     — zero-config: generates the Xcode project with XcodeGen,
#                    builds the app + widgets for the simulator (no signing),
#                    and runs the unit test suite. Use this to compile-verify
#                    every push from a Windows/Linux dev machine.
#   ios-testflight — signed App Store archive published to TestFlight.
#                    Requires one-time setup in the Codemagic UI (see the
#                    comments on that workflow) — until then, run ios-verify.
#
# Xcode: adhan-swift 1.5.0 uses swift-tools-version 6.0, so Xcode 16 is the
# minimum. `latest` keeps App Store submissions compatible with Apple's
# current-SDK requirement; the app targets iOS 17 with conservative APIs, so
# newer SDKs are expected to compile cleanly.

workflows:
  ios-verify:
    name: iOS verify (build + unit tests, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      # The server tests use Node's built-in SQLite (unflagged from 22.13).
      node: 22.13.0
    cache:
      cache_paths:
        - ~/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Enforce native content presentation
        script: |
          if grep -RInE --include='*.swift' --include='*.xcstrings' 'open on website|view on website|read on (naqshbandiaowaisiah\.org|quran\.com)|visit the source website|view source on' DarulIrfanApp; then
            echo "User-facing external content handoff text must not ship."
            exit 1
          fi
          python Tools/validate_native_presentation.py
      - name: Build app + widgets for simulator (no signing)
        script: |
          # Compact, readable output: raw log goes to an artifact, the console
          # shows only per-file progress and errors via xcbeautify.
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          mkdir -p build/logs
          xcodebuild build \
            -project DarulIrfan.xcodeproj \
            -scheme DarulIrfan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/Build.xcresult \
            2>&1 | tee build/logs/xcodebuild-build.log | xcbeautify
      - name: Run unit tests on simulator
        script: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          mkdir -p build/logs
          # Pick the first available iPhone simulator on this image so the
          # workflow survives Xcode image updates that rename devices.
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -n 1 | xargs)
          echo "Using simulator: ${DEVICE}"
          xcodebuild test \
            -project DarulIrfan.xcodeproj \
            -scheme DarulIrfan \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -only-testing:DarulIrfanTests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/Tests.xcresult \
            2>&1 | tee build/logs/xcodebuild-tests.log | xcbeautify
      - name: Run UI tests on simulator
        script: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          mkdir -p build/logs
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -n 1 | xargs)
          xcodebuild test \
            -project DarulIrfan.xcodeproj \
            -scheme DarulIrfan \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -only-testing:DarulIrfanUITests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/UITests.xcresult \
            2>&1 | tee build/logs/xcodebuild-ui-tests.log | xcbeautify
      - name: Verify serverless platform
        script: |
          cd Server
          npm ci
          npm run check
          npm test
      - name: Run content-ingest pipeline tests
        script: |
          cd Tools/ContentIngest
          pip3 install -r requirements.txt pytest
          python3 -m pytest tests -q
      - name: Test Quran translation importer
        script: |
          pip3 install -r Tools/Quran/requirements.txt pytest
          python3 -m pytest Tools/Quran/tests -q
          python3 -m unittest discover -s Tools/Hadith -p test_source_references.py
      - name: Content integrity gate
        script: |
          # Counts, bounds, unique keys, encoding, block sizes, and byte-for-byte
          # parity across the four platform seeds. The unit tests ran above, so
          # the migration result is known by the time this writes the report.
          python3 -m unittest discover -s Tools/ContentIntegrity -p 'test_*.py'
          python3 Tools/ContentIntegrity/check_content.py \
            --migration-status passed \
            --report build/CONTENT_INTEGRITY.md
      - name: Hadith content gate
        script: |
          # The October 2026 audit's hadith rules (HAD-035): each narration
          # shows its own Arabic, no markup, verse links quote their ayah,
          # Muslim numbers as recorded.
          python3 Tools/Hadith/hadith_gate.py
    artifacts:
      - build/*.xcresult
      - build/logs/*.log
      - build/CONTENT_INTEGRITY.md
    publishing:
      scripts:
        # Publishing scripts run even when a build step fails: print a small,
        # copy-pasteable summary of every compiler/test error at the very end
        # of the build page.
        - name: Error summary
          script: |
            echo "================ ERROR SUMMARY ================"
            if ls build/logs/*.log >/dev/null 2>&1; then
              grep -hE "(error|fatal error): |Testing failed|BUILD FAILED|TEST FAILED|BUILD SUCCEEDED|Test Suite.*(passed|failed)" build/logs/*.log | sort -u | head -120 \
                || echo "No error lines found in xcodebuild logs."
            else
              echo "No xcodebuild logs were produced (failure before the build step)."
            fi
            echo "==============================================="
      email:
        recipients:
          - wajidali1984@hotmail.com
        notify:
          success: false
          failure: true

  # Setup: the ASC_API_KEY App Store Connect integration (App Manager role)
  # must belong to the Apple Developer team that owns bundle id
  # us.naqshbaniaowaisiah, and an app record with that bundle id must exist in
  # App Store Connect for the TestFlight upload to land.
  #
  # Signing is done EXPLICITLY with `app-store-connect fetch-signing-files
  # --create`, which registers the bundle id (if missing), creates/reuses the
  # distribution certificate, and creates the app_store provisioning profile.
  # The declarative `ios_signing` environment block is intentionally NOT used:
  # it only *fetches* existing profiles and fails ("No matching profiles
  # found") when none exist yet.
  ios-screens:
    # Screenshots of every redesigned screen in English and Urdu, light and
    # dark, to check against parity-spec/redesign/boards before a release.
    # Started by hand only (Tools/Release/codemagic.py start ios-screens <branch>).
    # A build started with the variable DI_SCREENSHOTS=books takes only Read's books,
    # and one with DI_SCREENSHOTS=shajra only the Shajra (Zikr's button, Halqah's row).
    name: iOS screenshots (unsigned, simulator)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    cache:
      cache_paths:
        - ~/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Screenshot tour on simulator
        ignore_failure: true
        script: |
          set -o pipefail
          set +e # Capture failure status so the following steps can export diagnostics.
          command -v xcbeautify >/dev/null || brew install xcbeautify
          mkdir -p build/logs
          # Keep iPhone as the default; targeted tablet audits opt into iPad.
          DEVICE=$(python3 Tools/CI/select_simulator.py --family "${DI_SIMULATOR_FAMILY:-iPhone}") || exit 2
          TEST_FILTERS=(-only-testing:DarulIrfanUITests/RedesignScreenshotTests)
          if [ -n "${DI_SCREENSHOT_CASE:-}" ]; then
            case "$DI_SCREENSHOT_CASE" in
              testEnglishLight|testEnglishDark|testUrduLight|testUrduDark) ;;
              *) echo "Unsupported screenshot case"; exit 2 ;;
            esac
            TEST_FILTERS=(-only-testing:DarulIrfanUITests/RedesignScreenshotTests/test0Warmup
                          "-only-testing:DarulIrfanUITests/RedesignScreenshotTests/$DI_SCREENSHOT_CASE")
          fi
          touch build/audio-follow-started
          READER_SAMPLER_PID=""
          if [ "${DI_READER_PROFILE:-}" = "1" ]; then
            python3 Tools/CI/sample_reader_process.py > build/logs/reader-process-sampler.log 2>&1 &
            READER_SAMPLER_PID=$!
          fi
          AUDIO_SAMPLER_PID=""
          if [ "${DI_SCREENSHOTS:-}" = "audio-transport" ]; then
            python3 Tools/CI/collect_audio_environment.py
            python3 Tools/CI/sample_audio_probe.py > build/logs/audio-probe-sampler.log 2>&1 &
            AUDIO_SAMPLER_PID=$!
          fi
          TEST_RUNNER_DI_SCREENSHOTS=${DI_SCREENSHOTS:-1} python3 Tools/CI/run_with_deadline.py --seconds 3000 -- xcodebuild test \
            -project DarulIrfan.xcodeproj \
            -scheme DarulIrfan \
            -destination "platform=iOS Simulator,id=${DEVICE}" \
            "${TEST_FILTERS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/Screens.xcresult \
            2>&1 | tee build/logs/xcodebuild-screens.log | xcbeautify
          RESULT=$?
          if [ -n "$AUDIO_SAMPLER_PID" ]; then
            touch build/audio-probe-sampling-stop
            wait "$AUDIO_SAMPLER_PID"
          fi
          if [ -n "$READER_SAMPLER_PID" ]; then
            touch build/reader-sampling-stop
            wait "$READER_SAMPLER_PID"
          fi
          echo "$RESULT" > build/logs/screens-exit-code.txt
          exit "$RESULT"
      - name: Export the screenshots
        script: |
          mkdir -p build/screens
          if xcrun xcresulttool export attachments --path build/Screens.xcresult --output-path build/screens; then
            ls build/screens | head -n 5
          else
            echo "Exporting the attachments failed; keeping the result bundle instead."
            (cd build && zip -qr Screens.xcresult.zip Screens.xcresult)
          fi
          python3 Tools/CI/export_audio_follow_diagnostics.py
          if [ -d build/reader-profile ]; then
            cp -R build/reader-profile build/screens/reader-profile
          fi
          cd build && zip -qr screens.zip screens
      - name: Enforce screenshot test result after exporting diagnostics
        script: |
          # Preserve failure captures, but never report failed UI assertions
          # as a successful workflow merely because export succeeded.
          test "$(cat build/logs/screens-exit-code.txt)" -eq 0 || exit 1
          grep -Fq '** TEST SUCCEEDED **' build/logs/xcodebuild-screens.log
    artifacts:
      - build/screens.zip
      - build/Screens.xcresult.zip
      - build/logs/*.log
      - build/logs/screens-exit-code.txt

  ios-testflight:
    name: iOS TestFlight release (signed)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      node: 22.13.0
      groups:
        # Codemagic env-var group holding CERTIFICATE_PRIVATE_KEY (a PEM RSA
        # private key). Used to create/reuse the iOS Distribution certificate.
        # Also holds APP_STORE_CONNECT_ISSUER_ID, _KEY_IDENTIFIER and
        # _PRIVATE_KEY (key HF3C3684KV): the new account (2 Nov 2026) has no
        # App Store Connect integration, and the CLI tools read these directly.
        - ios_signing
    cache:
      cache_paths:
        - ~/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Run release preflight tests
        script: |
          if grep -RInE --include='*.swift' --include='*.xcstrings' 'open on website|view on website|read on (naqshbandiaowaisiah\.org|quran\.com)|visit the source website|view source on' DarulIrfanApp; then
            echo "User-facing external content handoff text must not ship."
            exit 1
          fi
          (cd Server && npm ci && npm run check && npm test)
          (cd Tools/ContentIngest && pip3 install -r requirements.txt pytest && python3 -m pytest tests -q)
          pip3 install -r Tools/Quran/requirements.txt pytest
          python3 -m pytest Tools/Quran/tests -q
          python3 -m unittest discover -s Tools/Hadith -p test_source_references.py
      - name: Run unit tests (includes the schema migration)
        script: |
          # A signed release must not ship past a failing migration or a
          # content check, so the tag workflow re-runs them rather than
          # trusting that ios-verify was green on the same commit.
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          mkdir -p build/logs
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -n 1 | xargs)
          echo "Using simulator: ${DEVICE}"
          xcodebuild test \
            -project DarulIrfan.xcodeproj \
            -scheme DarulIrfan \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -only-testing:DarulIrfanTests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/ReleaseTests.xcresult \
            2>&1 | tee build/logs/xcodebuild-release-tests.log | xcbeautify
      - name: Content integrity gate
        script: |
          python3 -m unittest discover -s Tools/ContentIntegrity -p 'test_*.py'
          python3 Tools/ContentIntegrity/check_content.py \
            --migration-status passed \
            --report build/CONTENT_INTEGRITY.md
      - name: Hadith content gate
        script: |
          # The October 2026 audit's hadith rules (HAD-035): each narration
          # shows its own Arabic, no markup, verse links quote their ayah,
          # Muslim numbers as recorded.
          python3 Tools/Hadith/hadith_gate.py
      - name: Set up code signing (create cert + profile if needed)
        script: |
          # set -e so a failure in fetch-signing-files aborts the step and
          # surfaces the real error instead of being masked by use-profiles.
          set -e
          echo "ASC integration -> keyId:${APP_STORE_CONNECT_KEY_IDENTIFIER:+set} issuerId:${APP_STORE_CONNECT_ISSUER_ID:+set} privateKey:${APP_STORE_CONNECT_PRIVATE_KEY:+set}"
          keychain initialize
          # --certificate-key supplies the private key so the CLI can create a
          # distribution certificate it can actually sign with (Apple only
          # returns the public cert; the private key must come from CI).
          app-store-connect fetch-signing-files "us.naqshbaniaowaisiah" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --verbose
          # Extension profiles must exist separately. All identifiers and the
          # shared App Group/APNs capabilities must first be registered in the
          # Apple Developer portal; Codemagic cannot infer those capabilities.
          for BUNDLE_ID in \
            us.naqshbaniaowaisiah.widgets \
            us.naqshbaniaowaisiah.watchkitapp \
            us.naqshbaniaowaisiah.watchkitapp.widgets
          do
            app-store-connect fetch-signing-files "${BUNDLE_ID}" \
              --type IOS_APP_STORE \
              --platform IOS \
              --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
              --create \
              --verbose
          done
          keychain add-certificates
          echo "--- Provisioning profiles fetched:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles --verbose
      # This Codemagic app started counting at 1 on 2 November 2026; Apple has
      # already seen build 87, so its first build here is 88.
      - name: Build signed archive
        script: |
          xcode-project build-ipa \
            --project DarulIrfan.xcodeproj \
            --scheme DarulIrfan \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 87))"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/CONTENT_INTEGRITY.md
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Internal testing only: upload the build (it becomes available to
        # internal testers once App Store Connect finishes processing) without
        # submitting for external beta review. External review requires the
        # one-time "Test Information" (feedback email + a review contact) and
        # adds Apple's ~1-day review to every build. Flip this to true — and
        # fill Test Information once in App Store Connect — when you want
        # external/public testers.
        submit_to_testflight: false
      email:
        recipients:
          - wajidali1984@hotmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # hadith-ingest — data generation, NOT an app build.
  #
  # Runs the keyless sunnah.com ingester to (re)generate the enriched hadith
  # corpus — Arabic split into isnad/matn/verse, full English, split Urdu,
  # structured Qur'an verse refs, bab chapters, and a narrator-bio store with
  # Urdu auto-translated from the existing bio — then vets it and either commits
  # the regenerated seed back to the branch (if GITHUB_PAT is set) or publishes
  # it as an artifact. The normal ios-verify / ios-testflight builds then just
  # bundle the already-generated data; they never scrape.
  #
  # HOW TO RUN
  #   * Manual:    Codemagic UI → Start new build → workflow "hadith-ingest",
  #                branch feat/official-platform.
  #   * Scheduled: Codemagic UI → this workflow → add a cron schedule
  #                (Codemagic schedules are configured in the UI, not in YAML).
  #   It is intentionally NOT push/PR triggered, so no app build ever scrapes.
  #
  # ENVIRONMENT (create these in the Codemagic UI as secure variable groups)
  #   hadith_ingest:
  #     GITHUB_PAT        fine-grained PAT with "contents: write" on this repo.
  #                       If absent, the seed is published as an artifact instead
  #                       of being committed — the run still succeeds.
  #     DI_TRANSLATE_URL  OpenAI-compatible chat completions endpoint (for the
  #     DI_TRANSLATE_KEY  Urdu bio auto-translation step). If absent, bios keep
  #     DI_TRANSLATE_MODEL their source languages and Urdu is marked pending
  #                       (needsUrdu) — never fabricated.
  # Only the iOS checkout exists on CI, so the ingester writes the iOS seed and
  # commits it; the other three platforms are synced from it by the packer where
  # all four checkouts live (see Docs/HADITH_CI_INGEST.md). The content-integrity
  # gate reports cross-platform parity as unverified on CI, exactly as today.
  hadith-ingest:
    name: Hadith corpus ingest (keyless sunnah.com → native seed)
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      groups:
        - hadith_ingest
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.hadith_cache
    # No `triggering:` block → never runs on push/PR; manual or scheduled only.
    scripts:
      - name: Install Python dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 lxml
      - name: Parser self-test (offline, fails fast before any scraping)
        script: |
          python3 Tools/Hadith/ingest_sunnah.py --selftest
      - name: Ingest, enrich, pack, vet, bump manifest
        script: |
          set -e
          python3 Tools/Hadith/ingest_sunnah.py \
            --all --pack --vet --bump-manifest --translate \
            --cache-dir "$CM_BUILD_DIR/.hadith_cache" \
            --throttle 1.2 \
            --out "$CM_BUILD_DIR/build/hadith"
      - name: Content integrity gate
        script: |
          python3 -m unittest discover -s Tools/ContentIntegrity -p 'test_*.py'
          python3 Tools/ContentIntegrity/check_content.py \
            --report "$CM_BUILD_DIR/build/CONTENT_INTEGRITY.md"
      - name: Hadith content gate
        script: |
          # The October 2026 audit's hadith rules (HAD-035): each narration
          # shows its own Arabic, no markup, verse links quote their ayah,
          # Muslim numbers as recorded.
          python3 Tools/Hadith/hadith_gate.py
      - name: Commit regenerated seed back (or fall back to an artifact)
        script: |
          set -e
          if [ -n "$GITHUB_PAT" ]; then
            git config user.email "ci@darulirfan.app"
            git config user.name "Darul Irfan CI (hadith-ingest)"
            git add DarulIrfanApp/Resources/SeedData
            if git diff --cached --quiet; then
              echo "No seed changes to commit."
            else
              git commit -m "Hadith: CI-ingested enriched corpus (auto) [skip ci]"
              BRANCH="${CM_BRANCH:-feat/official-platform}"
              git push "https://x-access-token:${GITHUB_PAT}@github.com/wali1984/Darul-Irfan.git" "HEAD:${BRANCH}"
              echo "Pushed regenerated seed to ${BRANCH}."
            fi
          else
            echo "GITHUB_PAT not set — publishing the seed as an artifact instead."
            mkdir -p "$CM_BUILD_DIR/build"
            tar czf "$CM_BUILD_DIR/build/hadith_seed.tgz" DarulIrfanApp/Resources/SeedData
          fi
    artifacts:
      - build/hadith/ingest_report.json
      - build/CONTENT_INTEGRITY.md
      - build/hadith_seed.tgz
    publishing:
      email:
        recipients:
          - wajidali1984@hotmail.com
        notify:
          success: true
          failure: true
