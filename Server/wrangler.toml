name = "darul-irfan-platform"
main = "src/index.ts"
compatibility_date = "2026-07-01"
routes = [{ pattern = "api.naqshbandiaowaisiah.us", custom_domain = true }]
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "production"
# The custom domain sits behind a Cloudflare firewall rule that blocks phones;
# links handed to the app use the workers.dev address the app already calls.
PUBLIC_BASE_URL = "https://darul-irfan-platform.wajidmahmoodali1984-e23.workers.dev"
YOUTUBE_CHANNEL_ID = "UCefP_tP1ROXmqu2miDVCtCg"
FACEBOOK_PAGE_ID = "oursheikh.official"
FACEBOOK_GRAPH_VERSION = "v25.0"
APNS_TOPIC = "us.naqshbaniaowaisiah"
# Holds every staff role on /admin (also needs to be allowed by the Cloudflare
# Access policy in front of it), and is super admin in the app for a member
# whose Apple sign-in carries one of these emails.
# Paltalk usernames whose OURSHEIKH chat messages are cues (latifa changes,
# muraqabat): the room's admins, moderators and speakers.
LIVE_CUE_HOSTS = "ameer_imam"
SUPER_ADMIN_EMAILS = "wajidali1984@hotmail.com,wajidmahmood@hotmail.com"

[[d1_databases]]
binding = "DB"
database_name = "darul-irfan"
database_id = "0b4ba0a2-0e52-4cd0-a3f4-1d7e20fdf01a"

# Pictures forwarded to the WhatsApp Business number. Create the bucket once:
#   npx wrangler r2 bucket create darul-irfan-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "darul-irfan-media"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Secrets configured with `wrangler secret put`:
# YOUTUBE_API_KEY, FACEBOOK_PAGE_ACCESS_TOKEN,
# APNS_KEY_ID, APNS_TEAM_ID, APNS_PRIVATE_KEY,
# ADMIN_EDITOR_EMAILS, ADMIN_BROADCASTER_EMAILS
