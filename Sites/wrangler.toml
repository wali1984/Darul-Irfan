# The public websites: oursheikh., namerica. and uk., with app-demo. and reporting.,
# each on wajidali.us (shared for now) and naqshbandiaowaisiah.us (kept for
# production). One Worker; the page is chosen by subdomain. Live data comes from the platform
# Worker through a service binding (no CORS, no public API host needed).
name = "darul-irfan-sites"
main = "src/index.js"
# The logo is bundled into the Worker; so are the reporting page's script and style (.txt).
rules = [{ type = "Data", globs = ["**/*.webp"], fallthrough = false }, { type = "Text", globs = ["**/*.txt"], fallthrough = false }]
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = false
routes = [
  { pattern = "oursheikh.naqshbandiaowaisiah.us", custom_domain = true },
  { pattern = "namerica.naqshbandiaowaisiah.us", custom_domain = true },
  { pattern = "uk.naqshbandiaowaisiah.us", custom_domain = true },
  { pattern = "app-demo.naqshbandiaowaisiah.us", custom_domain = true },
  { pattern = "reporting.naqshbandiaowaisiah.us", custom_domain = true },
  { pattern = "oursheikh.wajidali.us", custom_domain = true },
  { pattern = "namerica.wajidali.us", custom_domain = true },
  { pattern = "uk.wajidali.us", custom_domain = true },
  { pattern = "app-demo.wajidali.us", custom_domain = true },
  { pattern = "reporting.wajidali.us", custom_domain = true },
]

# app-demo.'s showcase files (PowerPoint, screenshots, admin screens) are served
# from demo-assets/ (not in git: copied from outputs/darul-app-showcase at deploy
# time); the interactive page, PDF and package exceed 25 MB and come from R2 demo/.
[assets]
directory = "./demo-assets"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "darul-irfan-media"

# Keeps the firewall's home_vpn IP list on vpn.wajidali.us (src/index.js followHomeVPN).
[triggers]
crons = ["*/5 * * * *"]

[vars]
HOME_VPN_HOST = "vpn.wajidali.us"
HOME_VPN_LIST_ID = "58eec7c74902461a8eed5ed121c18b89"
# Our Sheikh's live sound: the Silsila's Realtime SFU feed (Tools/LiveRelay), listen only.
# Staging for now; production will expose the same paths with a public listener role.
# LIVE_FEED_KEY (a listener-only key, never able to publish) is a secret.
LIVE_FEED_BASE = "https://darul-irfan-live-staging.wajidmahmoodali1984-e23.workers.dev"

[[services]]
binding = "API"
service = "darul-irfan-platform"

[observability]
enabled = true
