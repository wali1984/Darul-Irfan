name: DarulIrfan
options:
  bundleIdPrefix: org.naqshbandiaowaisiah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # adhan-swift 1.5.0 uses swift-tools-version 6.0, so Xcode 16 or newer is required.
  xcodeVersion: "16.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  DarulIrfan:
    type: application
    platform: iOS
    sources:
      - path: DarulIrfanApp
    dependencies:
      - package: Adhan
      - target: DarulIrfanWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.naqshbandiaowaisiah.darulirfan
        INFOPLIST_FILE: DarulIrfanApp/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: DarulIrfanApp/App/DarulIrfan.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.naqshbandiaowaisiah.darulirfan

  DarulIrfanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: DarulIrfanApp/Core/Shared
        # Shared prayer snapshot models compiled into both app and widget
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.naqshbandiaowaisiah.darulirfan.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: true
    entitlements:
      path: Widgets/DarulIrfanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.naqshbandiaowaisiah.darulirfan
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Darul Irfan Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DarulIrfanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DarulIrfanTests
    dependencies:
      - target: DarulIrfan
      - package: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.naqshbandiaowaisiah.darulirfan.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DarulIrfan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DarulIrfan"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DarulIrfanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DarulIrfanUITests
    dependencies:
      - target: DarulIrfan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.naqshbandiaowaisiah.darulirfan.uitests
        TEST_TARGET_NAME: DarulIrfan

schemes:
  DarulIrfan:
    build:
      targets:
        DarulIrfan: all
        DarulIrfanWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DarulIrfanTests
        - DarulIrfanUITests
    archive:
      config: Release
