name: DarulIrfan
options:
  bundleIdPrefix: us
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # adhan-swift 1.5.0 uses swift-tools-version 6.0, so Xcode 16 or newer is required.
  xcodeVersion: "16.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "2SGPX6K5YB"

targets:
  DarulIrfan:
    type: application
    platform: iOS
    sources:
      - path: DarulIrfanApp
        excludes:
          - "**/*.md"
    dependencies:
      - package: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah
        INFOPLIST_FILE: DarulIrfanApp/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # NOTE: The home-screen widget (DarulIrfanWidgets app-extension) and its
    # App Group entitlement are temporarily removed for the first TestFlight
    # build. Automatic code signing cannot provision an App Group that is not
    # registered in the Apple Developer portal, which blocked the whole
    # signed archive. The widget's Swift files remain in Widgets/ and
    # DarulIrfanApp/Core/Shared/ (the shared snapshot type is still compiled
    # into the app, and degrades to a no-op without the App Group).
    #
    # TO RE-ENABLE THE WIDGET (after registering, in the developer portal:
    # the App Group group.us.naqshbaniaowaisiah, with App Groups enabled on
    # both us.naqshbaniaowaisiah and us.naqshbaniaowaisiah.widgets):
    # restore from this file's git history —
    #   1) the `- target: DarulIrfanWidgets` + `embed: true` dependency above,
    #   2) this target's `entitlements:` block (the App Group),
    #   3) the whole `DarulIrfanWidgets:` target,
    #   4) `DarulIrfanWidgets: all` under schemes -> DarulIrfan -> build.

  DarulIrfanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DarulIrfanTests
    dependencies:
      - target: DarulIrfan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DarulIrfan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DarulIrfan"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DarulIrfanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DarulIrfanUITests
    dependencies:
      - target: DarulIrfan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.uitests
        TEST_TARGET_NAME: DarulIrfan

schemes:
  DarulIrfan:
    build:
      targets:
        DarulIrfan: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DarulIrfanTests
        - DarulIrfanUITests
    archive:
      config: Release
