name: DarulIrfan
options:
  bundleIdPrefix: us
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # adhan-swift 1.5.0 uses swift-tools-version 6.0, so Xcode 16 or newer is required.
  xcodeVersion: "16.0"

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.5.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.4.10"
    CURRENT_PROJECT_VERSION: "11"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "2SGPX6K5YB"

targets:
  DarulIrfan:
    type: application
    platform: iOS
    sources:
      - path: DarulIrfanApp
        excludes:
          - "**/*.md"
    dependencies:
      - package: Adhan
      - target: DarulIrfanWidgets
        embed: true
      - target: DarulIrfanWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah
        INFOPLIST_FILE: DarulIrfanApp/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: DarulIrfanApp/App/DarulIrfan.entitlements
      properties:
        com.apple.security.application-groups:
          - group.us.naqshbaniaowaisiah
        aps-environment: production

  DarulIrfanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: DarulIrfanApp/Core/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.widgets
        SKIP_INSTALL: true
    entitlements:
      path: Widgets/DarulIrfanWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.us.naqshbaniaowaisiah
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Darul Irfan Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DarulIrfanWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: DarulIrfanApp/Resources/Images/Assets.xcassets
      - path: DarulIrfanApp/Core/Shared
        excludes:
          - PrayerActivityAttributes.swift
    dependencies:
      - target: DarulIrfanWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.watchkitapp
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: WatchApp/DarulIrfanWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.us.naqshbaniaowaisiah
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Darul Irfan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: us.naqshbaniaowaisiah

  DarulIrfanWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets
      - path: DarulIrfanApp/Core/Shared
        excludes:
          - PrayerActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.watchkitapp.widgets
        SKIP_INSTALL: true
    entitlements:
      path: WatchWidgets/DarulIrfanWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.us.naqshbaniaowaisiah
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Darul Irfan Complications
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DarulIrfanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DarulIrfanTests
      - path: Server/test/fixtures/bootstrap.json
        buildPhase: resources
    dependencies:
      - target: DarulIrfan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DarulIrfan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DarulIrfan"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DarulIrfanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DarulIrfanUITests
    dependencies:
      - target: DarulIrfan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.naqshbaniaowaisiah.uitests
        TEST_TARGET_NAME: DarulIrfan

schemes:
  DarulIrfan:
    build:
      targets:
        DarulIrfan: all
        DarulIrfanWidgets: all
        DarulIrfanWatch: all
        DarulIrfanWatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DarulIrfanTests
        - DarulIrfanUITests
    archive:
      config: Release
