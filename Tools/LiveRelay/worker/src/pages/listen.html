<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Listener (staging)</title>
<style>
  :root { --bg:#0b1f18; --card:#12302a; --line:#1f4a40; --text:#eef5f1; --muted:#9db8ad; --gold:#e9c46a; --ok:#5fd39a; --bad:#ff8a7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; text-align:center; }
  h1 { font-size:20px; margin:8px 0 2px; } .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:12px; }
  #stage { font-size:34px; font-weight:700; color:var(--gold); min-height:48px; }
  #state { font-size:15px; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  button, input { font:inherit; border-radius:12px; border:1px solid var(--line); background:#0e2621; color:var(--text); padding:12px 16px; }
  button.primary { background:var(--gold); color:#1b1606; border-color:var(--gold); font-weight:600; width:100%; font-size:17px; }
  #log { text-align:left; font-size:13px; color:var(--muted); max-height:180px; overflow:auto; }
  #log div { padding:3px 0; border-bottom:1px solid var(--line); } input { width:100%; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <h1><span data-t>Live Zikr</span> <span id="staging" style="color:var(--gold)">· staging</span></h1>
  <p class="sub">Listener test page. Stands in for app listeners.</p>

  <div class="card" id="keyBox" hidden>
    <input id="keyInput" placeholder="Listener key"><button class="primary" id="keySave">Save</button>
  </div>

  <div class="card">
    <div id="state" data-t>Connecting…</div>
    <div id="stage"></div>
    <div class="sub" id="detail" style="margin:6px 0 0"></div>
  </div>

  <button class="primary" id="listen" data-t>Listen</button>
  <audio id="player" autoplay playsinline></audio>

  <div class="card" style="margin-top:12px"><div id="log"></div></div>
</main>
<script src="/client.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const NAMES = { app: Live.t("from the Darul Irfan app"), paltalk: Live.t("from the Paltalk room") };
  let state = null, wanted = false, current = null, linked = false, problem = "";
  // Each pull belongs to a generation; Stop or a source change moves on and
  // the old pull is cancelled, or discarded if it had already finished.
  let generation = 0, inflight = null;

  $("keySave").onclick = () => { Live.setKey($("keyInput").value); location.reload(); };

  $("listen").onclick = async () => {
    wanted = !wanted;
    $("listen").textContent = Live.t(wanted ? "Stop listening" : "Listen");
    if (wanted) { $("player").muted = false; await follow(); } else drop();
  };

  function drop() {
    generation += 1;
    if (inflight) { inflight.abort.abort(); inflight = null; }
    if (current) { try { current.pc.close(); } catch (_) {} current = null; }
    $("player").srcObject = null;
  }

  // Keeps the player on whatever the server says is on air.
  async function follow() {
    if (!wanted || !state) return;
    const a = state.active;
    const key = a.source ? `${a.sessionId}/${a.trackName}` : null;
    if (inflight) {
      if (inflight.key === key) return;
      inflight.abort.abort(); inflight = null;
    }
    if (current && current.key === key && current.pc.connectionState !== "failed") return;
    drop();
    if (!key) return;
    const mine = ++generation;
    const abort = new AbortController();
    inflight = { key, abort };
    try {
      const { pc, stream } = await Live.pull(a.sessionId, a.trackName, { signal: abort.signal });
      if (mine !== generation || !wanted) { try { pc.close(); } catch (_) {} return; }
      current = { pc, key };
      problem = "";
      $("player").srcObject = stream;
      await $("player").play().catch(() => {});
      pc.onconnectionstatechange = () => { if (current && current.pc === pc && pc.connectionState === "failed") { drop(); setTimeout(follow, 1000); } };
    } catch (e) {
      if (mine !== generation || abort.signal.aborted) return;
      problem = Live.t("Could not connect: ") + e.message;
      render();
      setTimeout(follow, 3000);
    } finally {
      if (inflight && inflight.abort === abort) inflight = null;
    }
  }

  function line(className, text, tail) {
    const span = document.createElement("span");
    span.className = className; span.textContent = text;
    $("state").replaceChildren(span, tail ? ` ${tail}` : "");
  }

  function render() {
    if (!state) return;
    const s = state;
    if (s.session.state !== "live") {
      $("state").textContent = Live.t(s.session.state === "ended" ? "The session has ended" : "Zikr has not started yet");
    } else if (!s.active.source) {
      line("bad", Live.t("Waiting for Hazrat Ji…"));
    } else {
      line("ok", Live.t("● Live"), NAMES[s.active.source]);
    }
    const last = s.stages[s.stages.length - 1];
    $("stage").textContent = s.session.state === "live" && last ? last.stage : "";
    $("detail").textContent = !linked ? Live.t("Reconnecting to the server…") : problem;
    // Stage names come from the relay and admins: text only, never markup.
    $("log").replaceChildren(...s.stages.slice().reverse().map((e) => {
      const row = document.createElement("div");
      const name = document.createElement("b");
      name.textContent = e.stage;
      row.append(name, ` · ${new Date(e.at).toLocaleTimeString()}`);
      return row;
    }));
  }

  Live.ready.then(() => {
    $("keyBox").hidden = !!Live.key || Live.inApp;
    if (Live.inApp) { document.querySelector(".sub").hidden = true; $("staging").hidden = true; }
    if (Live.key) Live.watch((s) => { state = s; render(); follow(); }, (up) => { linked = up; render(); });
    else if (Live.inApp) $("state").textContent = Live.t("Please sign in to the Halqah to listen.");
  });
</script>
</body>
</html>
