name: Content validation
on:
  pull_request:
    paths: ["Tools/ContentIngest/**", "content/**", ".github/workflows/content-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Tools/ContentIngest/requirements.txt pytest
      - run: python -m pytest Tools/ContentIngest/tests -q
      - run: python Tools/ContentIngest/ingest.py validate --dir content
